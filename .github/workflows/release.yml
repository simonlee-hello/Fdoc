name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Go 环境
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: 编译 Linux 二进制
        run: |
          make build-linux

      - name: 编译 macOS 二进制
        run: |
          make build-osx

      - name: 编译 Windows 二进制
        run: |
          make build-windows

      - name: 创建 Release 并上传二进制
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/linux/*
            build/osx/*
            build/windows/*
